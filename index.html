<!DOCTYPE html>
<html lang="es">
<head>

    :root {

      --text-light: #e6f1ff;
      --text-muted: #a8b2d1;
      --green-wa: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {

      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

      max-width: 600px;
    }

    header {
      text-align: center;
      padding: 15px 0 10px 0;

      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

      text-align: center;
      margin-bottom: 18px;

      backdrop-filter: blur(5px);
    }
